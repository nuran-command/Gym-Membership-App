syntax = "proto3";

package telemetry;

option go_package = "./telemetry";

service TelemetryService {
  rpc RecordAccess(RecordAccessRequest) returns (TelemetryResponse);
  rpc GetUsageStats(GetUsageRequest) returns (UsageStats);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc LogEvent(LogEventRequest) returns (TelemetryResponse);
}

message RecordAccessRequest {
  string user_id = 1;
  string asset_id = 2;
  string timestamp = 3;
}

message GetUsageRequest {
  string asset_id = 1;
  string period = 2;
}

message UsageStats {
  string asset_id = 1;
  int32 total_accesses = 2;
  float average_duration = 3;
}

message HeartbeatRequest {
  string device_id = 1;
  string status = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message LogEventRequest {
  string source = 1;
  string level = 2;
  string message = 3;
}

message TelemetryResponse {
  bool success = 1;
}
