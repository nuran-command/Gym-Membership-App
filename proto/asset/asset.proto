syntax = "proto3";

package asset;

option go_package = "./asset";

service AssetService {
  // Existing 5 endpoints
  rpc GetAsset(GetAssetRequest) returns (Asset);
  rpc ListAvailableAssets(ListRequest) returns (AssetList);
  rpc UpdateAssetStatus(UpdateStatusRequest) returns (Asset);
  rpc CheckAvailability(CheckRequest) returns (AvailabilityResponse);
  rpc GetHealthScore(GetAssetRequest) returns (HealthResponse);

  // New 7 endpoints to reach exactly 12 endpoints
  rpc CreateAsset(CreateAssetRequest) returns (Asset);
  rpc UpdateAsset(UpdateAssetRequest) returns (Asset);
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
  rpc ReportDamage(ReportDamageRequest) returns (Asset);
  rpc ResolveMaintenance(GetAssetRequest) returns (Asset);
  rpc ListAllAssets(ListAllRequest) returns (AssetList);
  rpc BatchCreateAssets(BatchCreateRequest) returns (BatchCreateResponse);
}

message Asset {
  string id = 1;
  string name = 2;
  string type = 3;
  string status = 4;
  int32 health_score = 5;
  string location = 6;
  string created_at = 7;
  string last_maintained_at = 8;
}

message GetAssetRequest {
  string id = 1;
}

message ListRequest {
  string type = 1;
}

message AssetList {
  repeated Asset assets = 1;
}

message UpdateStatusRequest {
  string id = 1;
  string status = 2;
}

message CheckRequest {
  string id = 1;
  string start_time = 2;
  string end_time = 3;
}

message AvailabilityResponse {
  bool available = 1;
}

message HealthResponse {
  int32 health_score = 1;
}

message CreateAssetRequest {
  string name = 1;
  string type = 2;
  string status = 3;
  int32 health_score = 4;
  string location = 5;
}

message UpdateAssetRequest {
  string id = 1;
  string name = 2;
  string type = 3;
  string location = 4;
}

message DeleteAssetRequest {
  string id = 1;
}

message DeleteAssetResponse {
  string id = 1;
  bool success = 2;
}

message ReportDamageRequest {
  string id = 1;
  int32 damage_amount = 2;
}

message ListAllRequest {
  string type = 1;
}

message BatchCreateRequest {
  repeated CreateAssetRequest assets = 1;
}

message BatchCreateResponse {
  repeated Asset assets = 1;
}
