version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gym-postgres
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=membership
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gym-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: gym-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5

  asset-service:
    build:
      context: .
      dockerfile: asset-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - PORT=50051
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/assets?sslmode=disable
      - REDIS_ADDR=redis:6379
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: on-failure

  membership-service:
    build:
      context: .
      dockerfile: membership-service/Dockerfile
    ports:
      - "50052:50052"
    environment:
      - PORT=50052
      - ASSET_SERVICE_ADDR=asset-service:50051
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/membership?sslmode=disable
      - REDIS_URL=redis:6379
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      asset-service:
        condition: service_started
    restart: on-failure

  telemetry-service:
    build:
      context: .
      dockerfile: telemetry-service/Dockerfile
    ports:
      - "50053:50053"
      - "2112:2112"
    environment:
      - PORT=50053
      - METRICS_PORT=2112
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/telemetry?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ASSET_SERVICE_ADDR=asset-service:50051
      - MEMBERSHIP_SERVICE_ADDR=membership-service:50052
      - TELEMETRY_SERVICE_ADDR=telemetry-service:50053
    depends_on:
      asset-service:
        condition: service_started
      membership-service:
        condition: service_started
      telemetry-service:
        condition: service_started
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gym-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  pgdata:
